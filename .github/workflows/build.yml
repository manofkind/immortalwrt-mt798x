name: Build GL-MT6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sudo apt-get clean

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'

      - name: Clone Source
        run: |
          git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git
          cd immortalwrt-mt798x
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd immortalwrt-mt798x
          cp -f defconfig/mt7986-ax6000.config .config
          cat >> .config << 'EOF'
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-app-mtk=y
          CONFIG_PACKAGE_kmod-macvlan=y
          EOF
          make defconfig

      - name: Build
        run: |
          cd immortalwrt-mt798x
          make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GL-MT6000
          path: immortalwrt-mt798x/bin/targets/mediatek/mt7986/*sysupgrade*
          retention-days: 7
